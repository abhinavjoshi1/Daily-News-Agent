name: Daily AI Digest

on:
  schedule:
    - cron: '30 21 * * *'  # 3:00 AM IST = 9:30 PM UTC
  workflow_dispatch:         # allows manual trigger from GitHub UI

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write        # needed to push digest back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: news_agent
        run: uv sync

      - name: Create .env file
        working-directory: news_agent
        run: |
          cat > .env << EOF
          NVIDIA_NIM_API_KEY=${{ secrets.NVIDIA_NIM_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE=${{ secrets.OPENAI_API_BASE }}
          SERPER_API_KEY=${{ secrets.SERPER_API_KEY }}
          MODEL=${{ secrets.MODEL }}
          EOF

      - name: Run CrewAI agent
        working-directory: news_agent
        run: uv run run_crew

      - name: Move digest to root digests folder
        run: |
          mkdir -p digests
          mv news_agent/digests/*.md digests/ 2>/dev/null || true

      - name: Commit and push digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          git diff --staged --quiet || git commit -m "Digest $(date +%d_%m_%y)"
          git push
