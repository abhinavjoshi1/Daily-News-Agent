name: Daily AI Digest

on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Debug - list files
        run: |
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          ls -la $GITHUB_WORKSPACE
          ls -la $GITHUB_WORKSPACE/news_agent

      - name: Install dependencies
        run: |
          cd $GITHUB_WORKSPACE/news_agent
          ls -la
          uv sync

      - name: Create .env file
        run: |
          cat > $GITHUB_WORKSPACE/news_agent/.env << EOF
          NVIDIA_NIM_API_KEY=${{ secrets.NVIDIA_NIM_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE=${{ secrets.OPENAI_API_BASE }}
          SERPER_API_KEY=${{ secrets.SERPER_API_KEY }}
          MODEL=${{ secrets.MODEL }}
          EOF

      - name: Run CrewAI agent
        run: |
          cd $GITHUB_WORKSPACE/news_agent
          uv run run_crew

      - name: Move digest to root digests folder
        run: |
          mkdir -p $GITHUB_WORKSPACE/digests
          mv $GITHUB_WORKSPACE/news_agent/digests/*.md $GITHUB_WORKSPACE/digests/ 2>/dev/null || true

      - name: Commit and push digest
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          git diff --staged --quiet || git commit -m "Digest $(date +%d_%m_%y)"
          git push
